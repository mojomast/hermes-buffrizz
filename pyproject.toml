[project]
name = "hermes-buffrizz"
version = "0.1.0"
description = "Pair with your Hermes agent in the official Freebuff CLI inside a Hermes pane, and queue coding tasks for it."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mojomast" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pyte>=0.8,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruamel.yaml>=0.18,<0.19",
  "tiktoken>=0.7,<1",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
